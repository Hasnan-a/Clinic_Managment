<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="{% block meta_description %}Small Clinic Management System — Patients, OPD Queue, Expenses & Dashboard{% endblock %}">

    <title>{% block title %}TechImport ERP Suite{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    {% load static %}

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">

    {% block extra_head %}{% endblock %}

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            font-family: Inter, Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
            overflow-x: hidden;

            --sidebar-open-width: 270px;
            --sidebar-collapsed-width: 78px;
            --navbar-height: 70px;
        }


        /* =========================================================
           APP LAYOUT
        ========================================================= */

        .app-wrapper {
            min-height: 100vh;
            width: 100%;
        }


        /*
            Sidebar open:
            main-content starts after 270px

            Sidebar collapsed:
            main-content starts after 78px

            Sidebar hover-expanded:
            main-content starts after 270px
        */

        .main-content {
            min-height: 100vh;

            margin-left: var(--sidebar-open-width);

            transition:
                margin-left .28s cubic-bezier(.4, 0, .2, 1);

            position: relative;

            width: auto;
        }


        body.sidebar-collapsed .main-content {
            margin-left: var(--sidebar-collapsed-width);
        }


        body.sidebar-collapsed.sidebar-hovered .main-content {
            margin-left: var(--sidebar-open-width);
        }


        /* =========================================================
           PAGE CONTENT
        ========================================================= */

        .page-content {
            min-height: calc(100vh - var(--navbar-height));

            padding: 24px;

            position: relative;

            z-index: 1;
        }


        .fade-in {
            animation: fadeInPage .25s ease;
        }


        @keyframes fadeInPage {

            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 768px) {

            .main-content {
                margin-left: 0 !important;
            }

            .page-content {
                padding: 18px;
            }

        }


        /* =========================================================
           MOBILE OVERLAY
        ========================================================= */

        .mobile-sidebar-overlay {
            position: fixed;

            inset: 0;

            background: rgba(15, 23, 42, .48);

            backdrop-filter: blur(2px);

            z-index: 1190;

            opacity: 0;

            visibility: hidden;

            transition:
                opacity .25s ease,
                visibility .25s ease;
        }


        .mobile-sidebar-overlay.show {
            opacity: 1;
            visibility: visible;
        }


        /* =========================================================
           BODY DARK MODE
        ========================================================= */

        body.dark-mode {
            background: #111827;
            color: #e5e7eb;
        }


        body.dark-mode .main-content {
            background: #111827;
        }


        body.dark-mode .page-content {
            color: #e5e7eb;
        }


        /* =========================================================
           REDUCE MOTION
        ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                transition-duration: .01ms !important;
                animation-duration: .01ms !important;
            }

        }

    </style>
</head>


<body>

<div class="app-wrapper">

    <!-- =========================================================
         SIDEBAR
    ========================================================= -->

    {% include 'partials/sidebar.html' %}


    <!-- =========================================================
         MAIN CONTENT
    ========================================================= -->

    <div class="main-content">

        <!-- Navbar -->
        {% include 'partials/navbar.html' %}


        <!-- Page Content -->
        <main class="page-content fade-in">

            {% block content %}{% endblock %}

        </main>

    </div>

</div>


<!-- =========================================================
     MOBILE OVERLAY
========================================================= -->

<div id="mobile-overlay"
     class="mobile-sidebar-overlay">
</div>


<!-- Bootstrap JS -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


{% block extra_scripts %}{% endblock %}


<script>

    /*
    =========================================================
       GLOBAL ALERT AUTO DISMISS
    =========================================================
    */

    setTimeout(function () {

        document
            .querySelectorAll('.alert-clinic.auto-dismiss')
            .forEach(function (el) {

                el.style.transition = 'opacity .4s';

                el.style.opacity = '0';

                setTimeout(function () {

                    el.remove();

                }, 400);

            });

    }, 4000);


</script>

</body>
</html>
