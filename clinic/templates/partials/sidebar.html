<style>
    :root {
        --sidebar-open-width: 250px;
        --sidebar-collapsed-width: 70px;
    }

    .erp-sidebar {
        position: fixed;
        left: 0;
        top: 0;
        width: var(--sidebar-open-width);
        height: 100vh;
        background: #0d1635;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        padding: 18px 12px;
        z-index: 1200;
        overflow: hidden;
        box-shadow: 5px 0 25px rgba(0, 0, 0, .10);
        transition: width .28s cubic-bezier(.4, 0, .2, 1), transform .28s ease;
        box-sizing: border-box;
    }

    .sidebar-brand {
        display: flex;
        align-items: center;
        min-height: 50px;
        padding: 0 4px;
        margin-bottom: 16px;
        flex-shrink: 0;
    }

    .sidebar-brand-icon {
        width: 38px;
        height: 38px;
        flex-shrink: 0;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #5b4cff, #3824d8);
        color: white;
        font-size: 19px;
        box-shadow: 0 6px 16px rgba(67, 56, 202, .35);
    }

    .sidebar-brand-text {
        display: flex;
        flex-direction: column;
        margin-left: 10px;
        white-space: nowrap;
        transition: opacity .2s ease, width .2s ease;
    }

    .brand-name {
        font-size: 17px;
        font-weight: 700;
        line-height: 19px;
    }

    .brand-sub {
        font-size: 10.5px;
        color: #9ca9d1;
        margin-top: 1px;
    }

    .sidebar-toggle-btn {
        margin-left: auto;
        width: 32px;
        height: 32px;
        flex-shrink: 0;
        border: none;
        border-radius: 8px;
        background: rgba(255, 255, 255, .07);
        color: #b8c3e5;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background .2s ease, color .2s ease, transform .2s ease;
    }

    .sidebar-toggle-btn:hover {
        background: #4338ca;
        color: white;
        transform: scale(1.04);
    }

    .sidebar-nav {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        padding-right: 2px;
        scrollbar-width: thin;
    }

    .sidebar-nav::-webkit-scrollbar { width: 4px; }
    .sidebar-nav::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, .12);
        border-radius: 10px;
    }

    .sidebar-section-label {
        display: block;
        font-size: 10px;
        font-weight: 700;
        color: #7785ae;
        letter-spacing: 1.1px;
        text-transform: uppercase;
        padding: 10px 10px 6px;
        white-space: nowrap;
    }

    .sidebar-nav-item { margin-bottom: 3px; }

    .sidebar-nav-link {

        align-items: center;
        width: 100%;
        min-height: 42px;
        padding: 0 12px;

        transform: translateX(2px);
    }

    .sidebar-nav-item.active .sidebar-nav-link {
        background: linear-gradient(135deg, #5146e5, #4033c5);
        color: white;
        box-shadow: 0 6px 16px rgba(67, 56, 202, .25);

    .sidebar-nav-icon {

    }

    .sidebar-nav-link:hover .sidebar-nav-icon,

    }

    .sidebar-nav-text {

    }

    }

    /* COLLAPSED STATE */
    body.sidebar-collapsed .erp-sidebar { width: var(--sidebar-collapsed-width); }

    body.sidebar-collapsed .sidebar-brand-text,
    body.sidebar-collapsed .sidebar-nav-text,
    body.sidebar-collapsed .sidebar-toggle-btn { display: none; }
    body.sidebar-collapsed .sidebar-nav-link { justify-content: center; padding: 0; }
    body.sidebar-collapsed .sidebar-section-label { height: 12px; font-size: 0; padding: 4px 0; opacity: .3; }

    body.sidebar-collapsed.sidebar-hovered .erp-sidebar {
        width: var(--sidebar-open-width);
        box-shadow: 10px 0 35px rgba(0, 0, 0, .25);
    }
    body.sidebar-collapsed.sidebar-hovered .sidebar-brand { justify-content: flex-start; }
    body.sidebar-collapsed.sidebar-hovered .sidebar-brand-text,
    body.sidebar-collapsed.sidebar-hovered .sidebar-nav-text,
    body.sidebar-collapsed.sidebar-hovered .sidebar-toggle-btn { display: flex; }
    body.sidebar-collapsed.sidebar-hovered .sidebar-nav-link { justify-content: flex-start; padding: 0 12px; }

    body.sidebar-collapsed:not(.sidebar-hovered) .sidebar-nav-link::after {
        content: attr(data-tooltip);
        position: absolute;
        left: 68px;
        top: 50%;
        transform: translateY(-50%);
        background: #111936;
        color: white;
        padding: 6px 10px;
        border-radius: 6px;
        font-size: 11px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: .15s ease;
        box-shadow: 0 6px 18px rgba(0, 0, 0, .25);
        z-index: 5000;
    }
    body.sidebar-collapsed:not(.sidebar-hovered) .sidebar-nav-link:hover::after { opacity: 1; }

    .mobile-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(2px);
        z-index: 1150;
        display: none;
    }
    .mobile-overlay.show { display: block; }

    @media (max-width: 768px) {
        .erp-sidebar { transform: translateX(-100%); width: 250px !important; }
        .erp-sidebar.mobile-open { transform: translateX(0); }
        body.sidebar-collapsed .erp-sidebar { transform: translateX(-100%); }
        body.sidebar-collapsed .erp-sidebar.mobile-open { transform: translateX(0); }
        body.sidebar-collapsed .sidebar-brand-text,
        body.sidebar-collapsed .sidebar-nav-text { display: flex; }
        body.sidebar-collapsed .sidebar-nav-link { justify-content: flex-start; padding: 0 12px; }
    }
</style>

<script>
(function () {
    const sidebar = document.getElementById("erp-sidebar");
    const toggleBtn = document.getElementById("sidebar-toggle-btn");
    const toggleIcon = document.getElementById("sidebar-toggle-icon");
    const overlay = document.getElementById("mobile-overlay");

    if (!sidebar || !toggleBtn) return;

    let isCollapsed = false;

    function setCollapsed(state) {
        isCollapsed = state;
        document.body.classList.toggle("sidebar-collapsed", isCollapsed);
        document.body.classList.remove("sidebar-hovered");
        if (toggleIcon) {
            toggleIcon.className = isCollapsed ? "bi bi-chevron-double-right" : "bi bi-chevron-double-left";
        }
    }

    toggleBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        if (window.innerWidth <= 768) {
            sidebar.classList.toggle("mobile-open");
            if (overlay) overlay.classList.toggle("show");
            return;
        }
        setCollapsed(!isCollapsed);
    });

    sidebar.addEventListener("mouseenter", function () {
        if (isCollapsed && window.innerWidth > 768) document.body.classList.add("sidebar-hovered");
    });

    sidebar.addEventListener("mouseleave", function () {
        if (isCollapsed && window.innerWidth > 768) document.body.classList.remove("sidebar-hovered");
    });

    if (overlay) {
        overlay.addEventListener("click", function () {
            sidebar.classList.remove("mobile-open");
            overlay.classList.remove("show");
        });
    }
})();
</script>
